<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - AulaNova</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #e0f2fe, #bae6fd, #e0e7ff, #f3e8ff);
            background-size: 400% 400%;
            animation: gradientAnimation 12s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        @keyframes floatBubble {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }
        body::before {
            content: '';
            position: absolute;
            width: 450px;
            height: 450px;
            background: rgba(2, 132, 199, 0.12);
            border-radius: 50%;
            top: -80px;
            left: -80px;
            z-index: 0;
            animation: floatBubble 8s ease-in-out infinite;
        }
        body::after {
            content: '';
            position: absolute;
            width: 380px;
            height: 380px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 50%;
            bottom: -60px;
            right: -60px;
            z-index: 0;
            animation: floatBubble 10s ease-in-out infinite reverse;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            z-index: 1;
            text-align: center;
        }
        .school-logo {
            width: 75px;
            height: 75px;
            object-fit: contain;
            margin-bottom: 12px;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
        }
        .brand-logo {
            font-size: 22px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .brand-logo span {
            color: #0284c7;
        }
        .school-name {
            font-size: 13px;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #334155;
            font-weight: 600;
            font-size: 13px;
        }
        input {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14px;
            color: #0f172a;
            background-color: #f8fafc;
            transition: all 0.25s ease;
        }
        input:focus {
            border-color: #0284c7;
            background-color: #ffffff;
            outline: none;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.2);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
        }
        button:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }
        .error-msg {
            background-color: #fef2f2;
            color: #991b1b;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            border: 1px solid #fecaca;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <img src="{{ url_for('static', filename='logo_colegio.jpg') }}" alt="Escudo I.E. 2060 Virgen de Guadalupe" class="school-logo">
        <div class="brand-logo">Aula<span>Nova</span></div>
        <div class="school-name">I.E. 2060 Virgen de Guadalupe</div>
        
        {% if error %}
            <div class="error-msg" role="alert">{{ error }}</div>
        {% endif %}

        <form action="/login" method="POST" autocomplete="off">
            <div class="form-group">
                <label for="correo">Usuario (Correo o DNI)</label>
                <input type="text" id="correo" name="correo" required placeholder="admin@guadalupe.edu.pe o DNI" autocomplete="new-password">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="new-password">
            </div>

            <button type="submit">Iniciar Sesión</button>
        </form>
    </div>

</body>
</html>
